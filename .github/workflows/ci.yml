name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: syntax check
        run: for f in src/*.py; do python3 -m py_compile "$f"; done
      - name: unpack samples
        run: |
          python3 src/unpack.py samples/hello-obfuscated.lua.txt
          python3 src/unpack.py samples/benchmark-obfuscated.lua.txt
      - name: tidy regression
        run: tests/run.sh
